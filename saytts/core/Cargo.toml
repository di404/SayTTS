[package]
name = "saytts-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
cpal = "0.18"
futures-util = { version = "0.3", features = ["sink"] }
hound = "3"
reqwest = { version = "0.13", features = ["stream", "json", "socks"] }
reqwest-websocket = "0.6"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
